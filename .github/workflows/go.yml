name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'binding/swig/**'
      - 'binding/_gograph.so'
      - 'binding/gograph.py'
      - 'binding/dist/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'binding/swig/**'
      - 'binding/_gograph.so'
      - 'binding/gograph.py'
      - 'binding/dist/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.25.1" ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download and verify dependencies
        run: |
          set -e
          go mod download
          go mod verify

      - name: Build all packages (excluding binding SWIG files)
        run: |
          set -e
          # 使用 -mod=mod 确保使用 go.mod 中的依赖
          go build -mod=mod ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests (with coverage)
        run: |
          set -e
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... \
            2>&1

      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-${{ matrix.go-version }}
          path: coverage.out
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          flags: go-${{ matrix.go-version }}
          verbose: true
        if: success()
